<!--
  Supabase Auth email template - "Reset Password".
  Paste this into: Supabase Dashboard → Authentication → Email Templates → Reset Password.
-->
<!doctype html>
<html lang="cs">
<body style="margin:0; padding:0; background-color:#EDE6D6; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EDE6D6;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" style="max-width:420px;" cellpadding="0" cellspacing="0">
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <img src="https://hriboradar.app/logo-mark.png" width="56" height="56" alt="Hřiboradar" style="display:block;" />
            </td>
          </tr>
          <tr>
            <td style="background-color:#F7F2E7; border:1px solid #E4DCC6; border-radius:16px; padding:32px 28px;">
              <h1 style="margin:0 0 12px; font-size:20px; line-height:1.3; color:#24261D;">Obnovení hesla</h1>
              <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#5A5847;">
                Někdo (doufáme, že vy) požádal o obnovení hesla k účtu Hřiboradar. Klikněte na tlačítko níže
                a nastavte si nové heslo.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-radius:999px; background-color:#33482C;">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block; padding:13px 28px; font-size:15px; font-weight:600; color:#F7F2E7; text-decoration:none;">
                      Nastavit nové heslo
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0; font-size:12px; line-height:1.6; color:#8C8A6E;">
                Pokud jste o obnovení hesla nežádali, tenhle e-mail můžete ignorovat - vaše heslo zůstane beze změny.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:20px; font-size:12px; color:#8C8A6E;">
              Hřiboradar · hriboradar.app
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
