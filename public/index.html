<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hřiboradar</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 420px;
    margin: 0 auto;
    padding: 64px 24px;
    line-height: 1.6;
    color: #24261D;
    background: #EDE6D6;
    text-align: center;
  }
  img { width: 72px; height: 72px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #5A5847; margin: 0 0 28px; }
  .btn {
    display: inline-block;
    background: #33482C;
    color: #F7F2E7;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 999px;
    font-weight: 600;
  }
</style>
</head>
<body>
<img src="/logo-mark.png" alt="Hřiboradar" />
<h1>Hřiboradar</h1>
<p>Houbařská appka, která odhaduje, kdy a kde by mohly růst houby, podle počasí, ročního období a typu okolního lesa.</p>
<a class="btn" href="hriboradar://">Otevřít appku</a>

<script>
  // Supabase's auth redirects (email confirm, password reset, ...) append
  // "#access_token=...&type=..." to whatever URL they land on. If Site URL
  // in the Supabase dashboard is still the bare domain instead of
  // /email-confirmed.html, this is where that lands - swapping the
  // headline so it doesn't read as a random generic homepage right after
  // someone just confirmed their e-mail (found 2026-09-03).
  if (location.hash.includes("access_token")) {
    document.querySelector("h1").textContent = "E-mail potvrzen";
    document.querySelector("p").textContent =
      "Účet je aktivní - appku teď můžete zavřít a přihlásit se v ní e-mailem a heslem, které jste si zvolili.";
  }
</script>
</body>
</html>
